name: trade QA
run-name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && format('release-certification-{0}', github.sha) || github.event_name == 'workflow_dispatch' && format('certification-{0}-{1}-{2}-{3}', inputs.release_certification, inputs.antitrust_release_sha, inputs.coordination_release_sha, inputs.test_tier) || github.event_name }}

on:
  push:
  pull_request:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      release_certification:
        description: 'Require explicit full SHAs for all source dependencies'
        required: false
        default: false
        type: boolean
      antitrust_ref:
        description: 'Antitrust development bootstrap ref (ignored for release certification)'
        required: false
        default: 'master'
        type: string
      antitrust_release_sha:
        description: 'Full 40-character antitrust candidate SHA'
        required: false
        type: string
      coordination_ref:
        description: 'Coordination development bootstrap ref (ignored for release certification)'
        required: false
        default: 'main'
        type: string
      coordination_release_sha:
        description: 'Full 40-character coordination candidate SHA'
        required: false
        type: string
      test_tier:
        description: 'Test tier for manual QA'
        required: false
        default: 'extended'
        type: choice
        options:
          - extended
          - nightly

# Development runs use the moving development refs and record their resolved
# SHAs. Automatic release-branch, master-push, master-targeted PR, and scheduled
# runs use exact upstream SHAs from this source's DESCRIPTION
# Remotes. Manual release certification accepts only explicit full commit SHAs
# for both dependencies.

jobs:
  check:
    name: R 4.6.1 dependency-stack check
    env:
      AUTOMATIC_RELEASE_PINS: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && (startsWith(github.ref_name, 'release/') || github.ref_name == 'master')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/') || github.base_ref == 'master'))) && 'true' || 'false' }}
      ANTITRUST_TEST_TIER: ${{ github.event_name == 'schedule' && 'nightly' || ((github.event_name == 'push' && startsWith(github.ref_name, 'release/')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/')))) && 'nightly' || inputs.test_tier || 'fast' }}
      TRADE_TEST_TIER: ${{ github.event_name == 'schedule' && 'nightly' || ((github.event_name == 'push' && startsWith(github.ref_name, 'release/')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/')))) && 'nightly' || github.event_name == 'pull_request' && 'extended' || inputs.test_tier || 'fast' }}
      RELEASE_CERTIFICATION: ${{ inputs.release_certification && 'true' || 'false' }}
      ANTITRUST_RELEASE_SHA_INPUT: ${{ inputs.antitrust_release_sha || '' }}
      COORDINATION_RELEASE_SHA_INPUT: ${{ inputs.coordination_release_sha || '' }}
      ANTITRUST_REQUESTED_REF: ${{ inputs.release_certification && inputs.antitrust_release_sha || inputs.antitrust_ref || 'master' }}
      COORDINATION_REQUESTED_REF: ${{ inputs.release_certification && inputs.coordination_release_sha || inputs.coordination_ref || 'main' }}
      _R_CHECK_FORCE_SUGGESTS_: "false"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'

      - name: Resolve exact dependency pins for release/mainline/scheduled runs
        id: release-pins
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'push' && (startsWith(github.ref_name, 'release/') || github.ref_name == 'master')) ||
          (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/') || startsWith(github.base_ref, 'release/') || github.base_ref == 'master'))
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")[1L, ]
          entries <- trimws(strsplit(desc[["Remotes"]], ",", fixed = TRUE)[[1L]])
          parsed <- lapply(entries, function(entry) {
            match <- regexec("^luciu5/([^/@]+)@([[:xdigit:]]{40})$", entry, perl = TRUE)
            parts <- regmatches(entry, match)[[1L]]
            if (length(parts) != 3L) stop("Malformed or mutable DESCRIPTION Remote: ", entry)
            c(package = parts[2L], sha = tolower(parts[3L]))
          })
          package_names <- vapply(parsed, `[[`, character(1), "package")
          if (anyDuplicated(package_names) || !setequal(package_names, c("antitrust", "coordination"))) {
            stop("Release branch Remotes must pin exactly antitrust and coordination")
          }
          pins <- setNames(vapply(parsed, `[[`, character(1), "sha"), package_names)
          env_lines <- c(
            paste0("ANTITRUST_REQUESTED_REF=", pins[["antitrust"]]),
            paste0("COORDINATION_REQUESTED_REF=", pins[["coordination"]])
          )
          output_lines <- c(
            paste0("antitrust=", pins[["antitrust"]]),
            paste0("coordination=", pins[["coordination"]])
          )
          write(env_lines, Sys.getenv("GITHUB_ENV"), append = TRUE)
          write(output_lines, Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

      - name: Validate dependency refs for release certification
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            for name in antitrust coordination; do
              if [[ "$name" == antitrust ]]; then
                sha="$ANTITRUST_RELEASE_SHA_INPUT"
                requested="$ANTITRUST_REQUESTED_REF"
              else
                sha="$COORDINATION_RELEASE_SHA_INPUT"
                requested="$COORDINATION_REQUESTED_REF"
              fi
              if [[ ! "$sha" =~ ^[[:xdigit:]]{40}$ ]]; then
                echo "Release certification requires an explicit full 40-character ${name}_release_sha input; mutable refs and missing release inputs are rejected." >&2
                exit 1
              fi
              if [[ "${requested,,}" != "${sha,,}" ]]; then
                echo "The selected ${name} ref does not match its explicit release SHA input" >&2
                exit 1
              fi
            done
          fi

      - name: Check out antitrust dependency
        uses: actions/checkout@v4
        with:
          repository: luciu5/antitrust
          ref: ${{ steps.release-pins.outputs.antitrust || env.ANTITRUST_REQUESTED_REF }}
          path: antitrust
      - name: Check out coordination dependency
        uses: actions/checkout@v4
        with:
          repository: luciu5/coordination
          ref: ${{ steps.release-pins.outputs.coordination || env.COORDINATION_REQUESTED_REF }}
          path: coordination
      - name: Record resolved source revisions and test tier
        shell: bash
        run: |
          set -euo pipefail
          core_sha="$(git -C antitrust rev-parse HEAD)"
          coordination_sha="$(git -C coordination rev-parse HEAD)"
          trade_sha="$(git rev-parse HEAD)"
          if [[ "$RELEASE_CERTIFICATION" == true && ( "$core_sha" != "${ANTITRUST_REQUESTED_REF,,}" || "$coordination_sha" != "${COORDINATION_REQUESTED_REF,,}" ) ]]; then
            echo "A checked-out dependency SHA differs from its explicit release candidate input" >&2
            exit 1
          fi
          if [[ "$ANTITRUST_REQUESTED_REF" =~ ^[[:xdigit:]]{40}$ && "$core_sha" != "${ANTITRUST_REQUESTED_REF,,}" ]]; then
            echo "The checked-out antitrust SHA differs from its exact requested SHA" >&2
            exit 1
          fi
          if [[ "$COORDINATION_REQUESTED_REF" =~ ^[[:xdigit:]]{40}$ && "$coordination_sha" != "${COORDINATION_REQUESTED_REF,,}" ]]; then
            echo "The checked-out coordination SHA differs from its exact requested SHA" >&2
            exit 1
          fi
          provenance_file="${RUNNER_TEMP}/trade-source-revisions.txt"
          {
            echo "release_certification=${RELEASE_CERTIFICATION}"
            echo "automatic_release_pins=${AUTOMATIC_RELEASE_PINS}"
            echo "requested_antitrust_ref=${ANTITRUST_REQUESTED_REF}"
            echo "requested_coordination_ref=${COORDINATION_REQUESTED_REF}"
            echo "antitrust_sha=${core_sha}"
            echo "coordination_sha=${coordination_sha}"
            echo "trade_sha=${trade_sha}"
            echo "antitrust_test_tier=${ANTITRUST_TEST_TIER}"
            echo "trade_test_tier=${TRADE_TEST_TIER}"
          } | tee "${provenance_file}"
          {
            echo "### Source provenance"
            echo
            echo "- release certification: \`${RELEASE_CERTIFICATION}\`"
            echo "- automatic release pins: \`${AUTOMATIC_RELEASE_PINS}\`"
            echo "- requested antitrust ref: \`${ANTITRUST_REQUESTED_REF}\`"
            echo "- requested coordination ref: \`${COORDINATION_REQUESTED_REF}\`"
            echo "- resolved antitrust SHA: \`${core_sha}\`"
            echo "- resolved coordination SHA: \`${coordination_sha}\`"
            echo "- resolved trade SHA: \`${trade_sha}\`"
            echo "- antitrust test tier: \`${ANTITRUST_TEST_TIER}\`"
            echo "- trade test tier: \`${TRADE_TEST_TIER}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Install the explicit trade test/runtime stack. competitiontoolbox is
          # an optional downstream Suggests package tested by its own dependency-
          # stack QA workflow.
          # Keep dependency resolution away from this package's pinned Remotes.
          packages: any::testthat, any::pkgload, any::BB, any::numDeriv, any::nleqslv, any::SQUAREM, any::MASS, any::ggplot2, any::knitr, any::bookdown, any::rmarkdown
          dependencies: '"hard"'
          install-pandoc: false
      - name: Verify DESCRIPTION Remotes for release certification
        if: env.RELEASE_CERTIFICATION == 'true' || env.AUTOMATIC_RELEASE_PINS == 'true'
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")[1L, ]
          entries <- trimws(strsplit(desc[["Remotes"]], ",", fixed = TRUE)[[1L]])
          parsed <- lapply(entries, function(entry) {
            match <- regexec("^luciu5/([^/@]+)@([[:xdigit:]]{40})$", entry, perl = TRUE)
            parts <- regmatches(entry, match)[[1L]]
            if (length(parts) != 3L) stop("Malformed or mutable DESCRIPTION Remote: ", entry)
            setNames(tolower(paste0("luciu5/", parts[2L], "@", parts[3L])), parts[2L])
          })
          actual <- unlist(parsed, use.names = TRUE)
          expected <- c(antitrust = paste0("luciu5/antitrust@", tolower(Sys.getenv("ANTITRUST_REQUESTED_REF"))),
                        coordination = paste0("luciu5/coordination@", tolower(Sys.getenv("COORDINATION_REQUESTED_REF"))))
          if (length(actual) != length(expected) || !setequal(names(actual), names(expected)) ||
              any(actual[names(expected)] != expected)) {
            stop("trade DESCRIPTION Remotes do not match the exact antitrust/coordination release SHAs")
          }
      - name: Install selected antitrust dependency
        run: R CMD INSTALL antitrust
      - name: Install selected coordination dependency
        run: R CMD INSTALL coordination
      - name: Verify selected coordination exports the trade helpers
        run: |
          Rscript -e 'required <- c("stackelberg_logit_h", "stackelberg_ces_multipliers"); missing <- setdiff(required, getNamespaceExports("coordination")); if (length(missing)) stop(sprintf("coordination ref %s does not export %s; release certification must use the candidate SHA containing these helpers", Sys.getenv("COORDINATION_REQUESTED_REF"), paste(missing, collapse = ", ")), call. = FALSE)'
          if [[ "$RELEASE_CERTIFICATION" == true || "$AUTOMATIC_RELEASE_PINS" == true ]]; then
            Rscript --vanilla -e 'stopifnot(utils::packageVersion("antitrust") >= "0.99.43", utils::packageVersion("coordination") >= "0.1.0")'
          fi
      - name: Remove dependency checkouts before building trade
        run: |
          rm -rf antitrust coordination
          test ! -e antitrust
          test ! -e coordination
      - name: Build trade
        run: R CMD build --no-manual --no-resave-data .
      - name: Verify source archive excludes CI checkouts
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -name 'trade_*.tar.gz' -print -quit)"
          test -n "$archive"
          listing="${RUNNER_TEMP}/trade-source-archive-files.txt"
          tar -tzf "$archive" > "$listing"
          if grep -Eq '(^|/)(\.ci|\.github|antitrust|coordination)(/|$)' "$listing"; then
            echo "The trade source archive contains CI checkout data" >&2
            exit 1
          fi
      - name: Check trade
        run: R CMD check --as-cran trade_*.tar.gz
      - name: Upload source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-source-provenance
          path: ${{ runner.temp }}/trade-source-revisions.txt
          if-no-files-found: warn
