name: trade QA

on:
  push:
  pull_request:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      release_certification:
        description: 'Require explicit full SHAs for all source dependencies'
        required: false
        default: false
        type: boolean
      antitrust_ref:
        description: 'Antitrust development bootstrap ref (ignored for release certification)'
        required: false
        default: 'master'
        type: string
      antitrust_release_sha:
        description: 'Full 40-character antitrust candidate SHA'
        required: false
        type: string
      coordination_ref:
        description: 'Coordination development bootstrap ref (ignored for release certification)'
        required: false
        default: 'main'
        type: string
      coordination_release_sha:
        description: 'Full 40-character coordination candidate SHA'
        required: false
        type: string
      test_tier:
        description: 'Test tier for manual QA'
        required: false
        default: 'extended'
        type: choice
        options:
          - extended
          - nightly

# Push, pull-request, and scheduled runs use the moving development refs and
# record their resolved SHAs. Manual release certification is a separate mode
# that accepts only explicit full commit SHAs for both source dependencies.

jobs:
  check:
    name: R 4.6.1 dependency-stack check
    env:
      ANTITRUST_TEST_TIER: ${{ github.event_name == 'schedule' && 'nightly' || inputs.test_tier || 'fast' }}
      TRADE_TEST_TIER: ${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'pull_request' && 'extended' || inputs.test_tier || 'fast' }}
      RELEASE_CERTIFICATION: ${{ inputs.release_certification && 'true' || 'false' }}
      ANTITRUST_REQUESTED_REF: ${{ inputs.release_certification && inputs.antitrust_release_sha || inputs.antitrust_ref || 'master' }}
      COORDINATION_REQUESTED_REF: ${{ inputs.release_certification && inputs.coordination_release_sha || inputs.coordination_ref || 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dependency refs for release certification
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            for item in "antitrust:$ANTITRUST_REQUESTED_REF" "coordination:$COORDINATION_REQUESTED_REF"; do
              name="${item%%:*}"
              sha="${item#*:}"
              if [[ ! "$sha" =~ ^[[:xdigit:]]{40}$ ]]; then
                echo "Release certification requires an explicit full 40-character ${name} SHA; mutable refs such as main/refactor are rejected." >&2
                exit 1
              fi
            done
          fi

      - name: Check out antitrust dependency
        uses: actions/checkout@v4
        with:
          repository: luciu5/antitrust
          ref: ${{ inputs.release_certification && inputs.antitrust_release_sha || inputs.antitrust_ref || 'master' }}
          path: antitrust
      - name: Check out coordination dependency
        uses: actions/checkout@v4
        with:
          repository: luciu5/coordination
          ref: ${{ inputs.release_certification && inputs.coordination_release_sha || inputs.coordination_ref || 'main' }}
          path: coordination
      - name: Record resolved source revisions and test tier
        shell: bash
        run: |
          set -euo pipefail
          core_sha="$(git -C antitrust rev-parse HEAD)"
          coordination_sha="$(git -C coordination rev-parse HEAD)"
          trade_sha="$(git rev-parse HEAD)"
          if [[ "$RELEASE_CERTIFICATION" == true && ( "$core_sha" != "${ANTITRUST_REQUESTED_REF,,}" || "$coordination_sha" != "${COORDINATION_REQUESTED_REF,,}" ) ]]; then
            echo "A checked-out dependency SHA differs from its explicit release candidate input" >&2
            exit 1
          fi
          provenance_file="${RUNNER_TEMP}/trade-source-revisions.txt"
          {
            echo "release_certification=${RELEASE_CERTIFICATION}"
            echo "requested_antitrust_ref=${ANTITRUST_REQUESTED_REF}"
            echo "requested_coordination_ref=${COORDINATION_REQUESTED_REF}"
            echo "antitrust_sha=${core_sha}"
            echo "coordination_sha=${coordination_sha}"
            echo "trade_sha=${trade_sha}"
            echo "antitrust_test_tier=${ANTITRUST_TEST_TIER}"
            echo "trade_test_tier=${TRADE_TEST_TIER}"
          } | tee "${provenance_file}"
          {
            echo "### Source provenance"
            echo
            echo "- release certification: \`${RELEASE_CERTIFICATION}\`"
            echo "- requested antitrust ref: \`${ANTITRUST_REQUESTED_REF}\`"
            echo "- requested coordination ref: \`${COORDINATION_REQUESTED_REF}\`"
            echo "- resolved antitrust SHA: \`${core_sha}\`"
            echo "- resolved coordination SHA: \`${coordination_sha}\`"
            echo "- resolved trade SHA: \`${trade_sha}\`"
            echo "- antitrust test tier: \`${ANTITRUST_TEST_TIER}\`"
            echo "- trade test tier: \`${TRADE_TEST_TIER}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat, any::pkgload, any::BB, any::numDeriv, any::nleqslv, any::SQUAREM, any::MASS, any::ggplot2, any::knitr, any::bookdown, any::rmarkdown, any::competitiontoolbox
      - name: Verify DESCRIPTION Remotes for release certification
        if: env.RELEASE_CERTIFICATION == 'true'
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")[1L, ]
          entries <- trimws(strsplit(desc[["Remotes"]], ",", fixed = TRUE)[[1L]])
          parsed <- lapply(entries, function(entry) {
            match <- regexec("^luciu5/([^/@]+)@([[:xdigit:]]{40})$", entry, perl = TRUE)
            parts <- regmatches(entry, match)[[1L]]
            if (length(parts) != 3L) stop("Malformed or mutable DESCRIPTION Remote: ", entry)
            setNames(tolower(paste0("luciu5/", parts[2L], "@", parts[3L])), parts[2L])
          })
          actual <- unlist(parsed, use.names = TRUE)
          expected <- c(antitrust = paste0("luciu5/antitrust@", tolower(Sys.getenv("ANTITRUST_REQUESTED_REF"))),
                        coordination = paste0("luciu5/coordination@", tolower(Sys.getenv("COORDINATION_REQUESTED_REF"))))
          if (length(actual) != length(expected) || !setequal(names(actual), names(expected)) ||
              any(actual[names(expected)] != expected)) {
            stop("trade DESCRIPTION Remotes do not match the exact antitrust/coordination release SHAs")
          }
      - name: Install selected antitrust dependency
        run: R CMD INSTALL antitrust
      - name: Install selected coordination dependency
        run: R CMD INSTALL coordination
      - name: Verify selected coordination exports the trade helpers
        run: |
          Rscript -e 'required <- c("stackelberg_logit_h", "stackelberg_ces_multipliers"); missing <- setdiff(required, getNamespaceExports("coordination")); if (length(missing)) stop(sprintf("coordination ref %s does not export %s; release certification must use the candidate SHA containing these helpers", Sys.getenv("COORDINATION_REQUESTED_REF"), paste(missing, collapse = ", ")), call. = FALSE)'
          if [[ "$RELEASE_CERTIFICATION" == true ]]; then
            Rscript --vanilla -e 'stopifnot(utils::packageVersion("antitrust") >= "0.99.43", utils::packageVersion("coordination") >= "0.1.0")'
          fi
      - name: Remove dependency checkouts before building trade
        run: rm -rf antitrust coordination
      - name: Build trade
        run: R CMD build --no-manual --no-resave-data .
      - name: Check trade
        run: R CMD check --as-cran trade_*.tar.gz
      - name: Upload source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-source-provenance
          path: ${{ runner.temp }}/trade-source-revisions.txt
          if-no-files-found: warn
